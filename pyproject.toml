[project]
name = "trader"
version = "0.1.0"
description = "LLM 멀티 에이전트 + ML 주식 자동매매 (KIS)"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
trader = "trader.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
