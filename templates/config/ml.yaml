# ML 설정. 로더는 Phase 7 에서 추가한다.
label:
  mode: relative_tercile   # 같은 날·시장 안 순위 삼분위 (기준선 1/3 고정, scan 랭커 용도). absolute 는 ±thresholds 3분류
  horizon_days: 5
  thresholds: {up: 0.02, down: -0.02}
  embargo_days: 5
train:
  window_years: 3
  walk_forward_folds: 6
models:
  # 승격은 알파 기준: 폴드별 상위 5 종목 초과수익의 평균 ≥ 0.003(KR 왕복 30bp) 이고 알파가 양인 폴드 ≥ 67%.
  # accuracy 로 바꾸면 기존(정확도 > 기준선 ∧ ≥ 0.40) 기준.
  quant: {enabled: true, promote_metric: alpha, promote_min_alpha: 0.003, promote_min_positive_folds: 0.67, promote_min_accuracy: 0.40}
  ranker: {enabled: true}
  calibration: {enabled: true, min_decisions: 60}
  # rl_sizer.horizon_days 는 학습 때 label.horizon_days 로 덮인다(보상 정규화용). 승격은 `trader rl promote` 수동.
  rl_sizer: {enabled: false, seeds: 3, mode: shadow, backend: auto}
