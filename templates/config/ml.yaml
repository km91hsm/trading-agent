# ML 설정. 로더는 Phase 7 에서 추가한다.
label:
  mode: relative_tercile   # 같은 날·시장 안 순위 삼분위 (기준선 1/3 고정, scan 랭커 용도). absolute 는 ±thresholds 3분류
  horizon_days: 5
  thresholds: {up: 0.02, down: -0.02}
  embargo_days: 5
train:
  window_years: 3
  walk_forward_folds: 6
models:
  # 승격은 알파 기준(alpha_topn): 날짜마다 p_up 상위 promote_top_n(5) 종목의 수익 − 그날 유니버스 평균을 날짜 평균한
  # 값이 폴드 평균 ≥ 0.003(KR 왕복 30bp) 이고 양인 폴드 ≥ 0.66(6폴드 중 4). (풀링 알파 `alpha` 는 참고용)
  # accuracy 로 바꾸면 기존(정확도 > 기준선 ∧ ≥ 0.40) 기준.
  # backend auto: lightgbm 이 import 되면 lightgbm(macOS 는 libomp 필요), 아니면 sklearn. 모델 메타 backend 에 기록.
  # learning_rate·num_leaves·max_iter 는 `trader ml tune` 리포트를 보고 바꾼다 (자동 적용 없음).
  quant: {enabled: true, backend: auto, promote_metric: alpha, promote_min_alpha: 0.003, promote_min_positive_folds: 0.66, promote_min_accuracy: 0.40}
  ranker: {enabled: true}
  calibration: {enabled: true, min_decisions: 60}
  # rl_sizer.horizon_days 는 학습 때 label.horizon_days 로 덮인다(보상 정규화용). 승격은 `trader rl promote` 수동.
  rl_sizer: {enabled: false, seeds: 3, mode: shadow, backend: auto}
