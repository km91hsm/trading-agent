# 루프 실행 시각. 시장별 tz(기본 Asia/Seoul). US 는 뉴욕 시간으로 적어 서머타임을 자동 반영한다.
# scan 시각에 scan → analyze 가 한 잡으로 이어서 돈다 (analyze 키는 없어도 되고, 있어도 쓰지 않는다).
kr:
  scan: "07:30"
  monitor: {start: "09:00", end: "15:30", interval_s: 60}
us:
  tz: America/New_York
  scan: "08:30"
  monitor: {start: "09:30", end: "16:00", interval_s: 60}
reflect: "16:30"
ml_train: {weekday: "sat", time: "10:00"}
news_collect: {interval_s: 1800}   # 시장 전체 뉴스 저장소 수집 주기 (Phase 19)
reconcile: {kr: "16:40", us: "16:40"}  # 야간 KIS 대조(보유 수량·미정리 주문), 시장별 현지 시각 (Phase 21)
rebalance: {weekday: fri, kr: "14:30", us: "15:00"}  # 주간 리밸런스(Phase 25), 시장별 현지 시각 — 마감 전
