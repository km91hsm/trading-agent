# 루프 실행 시각. 시장별 tz(기본 Asia/Seoul). US 는 뉴욕 시간으로 적어 서머타임을 자동 반영한다.
kr:
  scan: "07:30"
  analyze: "07:40"
  monitor: {start: "09:00", end: "15:30", interval_s: 60}
us:
  tz: America/New_York
  scan: "08:30"
  analyze: "08:40"
  monitor: {start: "09:30", end: "16:00", interval_s: 60}
reflect: "16:30"
ml_train: {weekday: "sat", time: "10:00"}
