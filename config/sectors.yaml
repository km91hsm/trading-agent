# 종목 → 동종업 대분류 (사람이 관리하는 결정적 데이터, 스펙 §3 "동종업 중앙값 대비").
# 피처 스토어의 `*_vs_sector` 열(비율 − 같은 날·같은 시장·같은 섹터 중앙값)과 `00_inputs.fundamental.peer`
# 가 이 맵을 쓴다. 섹터가 3종목 미만인 날은 NaN. 유니버스 종목을 바꾸면 여기도 같이 고치고
# templates/config/sectors.yaml 과 동일하게 유지한다(패리티 테스트). 모르는 종목은 `기타`.
sectors:
  - 반도체
  - IT/플랫폼
  - 2차전지/소재
  - 자동차/부품
  - 에너지/화학
  - 바이오/제약
  - 금융
  - 소비재/유통
  - 산업재/건설
  - 통신/미디어
  - 기타
# KIS 업종 → 대분류 (사람이 관리). `trader universe sectors --market KR|US` 가 유니버스에 새로 넣은 종목의
# 섹터를 이 표로 제안하고 `--write` 로 아래 kr:/us: 에 덧붙인다. 표에 없는 업종은 추측하지 않고 알려 준다.
