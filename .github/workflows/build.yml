name: build-bundle

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # 태그 릴리스에 zip 첨부 (기본 토큰은 읽기 전용)

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 의존성
        run: uv sync --group build
      - name: 테스트
        run: uv run pytest -q
      - name: 웹 프런트 빌드
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: 번들 빌드·스모크·zip
        run: uv run --group build python packaging/build.py --skip-web
      - uses: actions/upload-artifact@v4
        with:
          name: trader-${{ matrix.os }}
          path: dist/trader-*.zip
          if-no-files-found: error
      - name: 릴리스 첨부 (태그 푸시)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/trader-*.zip
